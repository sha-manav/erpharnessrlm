# Model endpoints. Secrets live in .env / the environment, never here.
#
# Both models are served by OpenRouter so that config A (pi, which speaks the
# `openrouter` provider natively) and configs B/C (our OpenAI-compatible loop) hit the
# same endpoint and the same weights. `pi_model` is the string Harbor passes to pi as
# `-m provider/model`.
#
# temperature: null means "do not send the field" — pi never sets temperature, so our
# harness must not either, or the configs would differ on more than the harness.
# Pricing is USD per million tokens, used only for the cost-per-task metric.
#
# provider_routing is sent by our own loop (harness/llm.py) as the OpenRouter `provider`
# field. Two reasons, both measured (NOTES.md ## Models / Provider routing):
#   cost     GLM-5.1 has 14 upstreams whose cache-read price spans 6x ($0.098-$0.600 per
#            Mtok), and cache reads are ~80% of our input tokens.
#   validity upstreams differ in quantization (fp8 vs fp4). Letting requests roam means
#            different configs can run against different weights, which breaks PLAN.md
#            hard rule 9. Pinning to fp8 removes the confound.
# pi (config A) offers no such hook, so the same restriction is set account-wide in the
# OpenRouter dashboard; that is what covers config A.
#
# role: which model a run should use by default. Iteration is done on `small` because a
# dev trial costs ~$0.10 there versus ~$0.73 on `big`; only dev-curve points that go into
# the write-up need `big`.

big:
  base_url: https://openrouter.ai/api/v1
  api_key_env: MODEL_BIG_API_KEY
  model: z-ai/glm-5.1
  pi_model: openrouter/z-ai/glm-5.1
  temperature: null
  # 4096 truncated the model mid-tool-call: a `python` call carrying a plan function is
  # easily longer than that, and a cut-off call leaves unparseable JSON in
  # tool_calls.function.arguments, which the provider rejects with HTTP 400 and the
  # trajectory dies. pi sets no max_tokens at all (provider default), so a generous value
  # is also the closer match to the baseline.
  max_tokens: 16384
  supports_prompt_cache: null      # measured in P0.4
  pricing_per_mtok: {input: 0.966, cached_input: null, output: 3.036}
  leaderboard_pass_at_1: 35.8      # published coding-mode number for GLM-5.1
  provider_routing: {only: [gmicloud, chutes], allow_fallbacks: false, quantizations: [fp8]}
  est_cost_per_trial_usd: 0.73     # measured over 49 eval100 trials of config A (dev5's $0.23 was
                                   # unrepresentative: dev5 is the five easiest patterns)

small:
  base_url: https://openrouter.ai/api/v1
  api_key_env: MODEL_SMALL_API_KEY
  model: qwen/qwen3-32b
  pi_model: openrouter/qwen/qwen3-32b
  temperature: null
  max_tokens: 16384
  supports_prompt_cache: null
  pricing_per_mtok: {input: 0.08, cached_input: null, output: 0.28}
  leaderboard_pass_at_1: null
  provider_routing: {allow_fallbacks: true, quantizations: [fp8]}
  est_cost_per_trial_usd: 0.05     # ~7x cheaper per token than GLM-5.1; re-measure after the first run
